name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  # Typecheck, lint, testes (incluindo contencao-do-brabo.spec.ts) e o bundle do tsup.
  pacotes:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: '11.3.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.10.0'
          cache: pnpm
      # `@brabo/docker-port` vem de brabo-contracts por tag (git); o runner tem rede para o GitHub.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Imagem de produção: builda, NÃO publica. A publicação é do release, por digest, no fluxo do produto.
  imagem:
    name: Build da imagem (sem publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build (sem push)
        run: docker build -f Dockerfile -t brabo-broker:ci .

  # Hotfix (PR hotfix/* -> main): publica `:sha-<12 do head>` para o E2E do brabo-qa (AT-765).
  # Mesmas flags de Trivy e assinatura por digest do release.yml; permissões só neste job.
  # A identidade do cosign é este ci.yml (o brabo-qa aceita release|ci).
  imagem-hotfix:
    name: Imagem do hotfix (sha-)
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGEM: ghcr.io/viralabs-dev/brabo-broker
      TRIVY_VERSION: '0.70.0'
      TRIVY_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'
      TAG_SHA: sha-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # head, não o merge ref
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Login no GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag sha-<12>
        id: v
        run: echo "tag=${TAG_SHA:0:16}" >> "$GITHUB_OUTPUT"
      - name: Build e push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ steps.v.outputs.tag }}
          build-args: |
            BRABO_VERSION=${{ steps.v.outputs.tag }}
      - name: Instalar o binário do trivy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
      - name: Trivy — HIGH/CRITICAL com correção reprova
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ignore=(); [ -f .trivyignore.yaml ] && ignore=(--ignorefile .trivyignore.yaml)
          trivy image --cache-dir /tmp/trivy-cache --image-src remote --no-progress \
            --format table --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            "${ignore[@]}" --exit-code 1 "${IMAGEM}@${DIGEST}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Assinar por digest e verificar no mesmo run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGEM}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGEM}@${DIGEST}" > /dev/null
