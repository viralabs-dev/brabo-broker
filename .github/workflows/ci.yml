name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  # Actionlint e pins do brabo-ci (AT-819). Não é check obrigatório.
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
    with:
      ci_ref: 53200467cadc73c5c23b90545474d4948764932f  # v1.4.0

  # Typecheck, lint, testes (incluindo contencao-do-brabo.spec.ts) e o bundle do tsup.
  pacotes:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # o @brabo/docker-port vem do GitHub Packages (AT-770)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          version: '11.3.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.10.0'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@viralabs-dev'
      # `@brabo/docker-port` é o pacote `@viralabs-dev/brabo-docker-port` do GitHub Packages (alias do pnpm).
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Imagem de produção: builda, NÃO publica. A publicação é do release, por digest, no fluxo do produto.
  imagem:
    name: Build da imagem (sem publicar)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # O token do registry vai SÓ como secret do BuildKit (RN-1039), nunca em ARG/ENV.
      - name: npmrc do registry (secret do BuildKit)
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "${NPM_TOKEN}" > "${RUNNER_TEMP}/npmrc"
      - name: Build (sem push)
        run: docker build --secret "id=npmrc,src=${RUNNER_TEMP}/npmrc" -f Dockerfile -t brabo-broker:ci .

  # Imagem da PR: publica `:sha-<12 do head>` para o E2E (PR hotfix/* -> main, AT-765) e para o regressivo
  # (PR -> dev, AT-769; decisão do dono 06/11: assinada, apagada ao fechar a PR ou em 7 dias).
  # Fora de PR de fork e de Dependabot (sem packages: write).
  # Mesmas flags de Trivy e assinatura por digest do release.yml; permissões só neste job.
  # A identidade do cosign é este ci.yml (o brabo-qa aceita release|ci).
  imagem-hotfix:
    name: Imagem da PR (sha-)
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || (github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/'))) && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGEM: ghcr.io/viralabs-dev/brabo-broker
      TRIVY_VERSION: '0.70.0'
      TRIVY_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'
      TAG_SHA: sha-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # head, não o merge ref
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Login no GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag sha-<12>
        id: v
        run: echo "tag=${TAG_SHA:0:16}" >> "$GITHUB_OUTPUT"
      - name: npmrc do registry (secret do BuildKit, RN-1039)
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "${NPM_TOKEN}" > "${RUNNER_TEMP}/npmrc"
      - name: Build e push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          secret-files: |
            npmrc=${{ runner.temp }}/npmrc
          tags: |
            ${{ env.IMAGEM }}:${{ steps.v.outputs.tag }}
          build-args: |
            BRABO_VERSION=${{ steps.v.outputs.tag }}
      - name: Instalar o binário do trivy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
      - name: Trivy — HIGH/CRITICAL com correção reprova
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ignore=(); [ -f .trivyignore.yaml ] && ignore=(--ignorefile .trivyignore.yaml)
          trivy image --cache-dir /tmp/trivy-cache --image-src remote --no-progress \
            --format table --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            "${ignore[@]}" --exit-code 1 "${IMAGEM}@${DIGEST}"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - name: Assinar por digest e verificar no mesmo run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGEM}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGEM}@${DIGEST}" > /dev/null
