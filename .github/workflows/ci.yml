name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  # Typecheck, lint, testes (incluindo contencao-do-brabo.spec.ts) e o bundle do tsup.
  pacotes:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: '11.3.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.10.0'
          cache: pnpm
      # `@brabo/docker-port` vem de brabo-contracts por tag (git); o runner tem rede para o GitHub.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Imagem de produção: builda, NÃO publica. A publicação é do release, por digest, no fluxo do produto.
  imagem:
    name: Build da imagem (sem publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build (sem push)
        run: docker build -f Dockerfile -t brabo-broker:ci .
